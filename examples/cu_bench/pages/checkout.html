<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout — Aurora Tools</title>
<style>
  body { font-family: sans-serif; margin: 2rem; background: #fafafa; }
  .summary { border: 1px solid #ccd; border-radius: 8px; padding: 18px; width: 380px; background: #fff; }
  button { padding: 12px 24px; font-size: 16px; }
  /* the confirmation modal */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
             align-items: center; justify-content: center; }
  #dialog { background: #fff; border-radius: 10px; padding: 24px; width: 380px; box-shadow: 0 8px 40px rgba(0,0,0,.3); }
  #dialog h2 { margin-top: 0; }
  .row { display: flex; gap: 12px; margin-top: 18px; }
  .row button { flex: 1; }
  .danger { background: #c62831; color: #fff; }
</style>
</head>
<body data-page="checkout.html">
<h1>Checkout</h1>
<div class="summary">
  <p><strong>Pro Toolkit</strong> — $49/month</p>
  <button id="pay-btn" data-gt="pay" onclick="openDialog()">Pay $49</button>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <div id="dialog">
    <h2 id="dlg-title" data-gt="dialog-title">Confirm payment $49</h2>
    <p>You are about to charge <strong>$49.00</strong> to your saved card ending in 4242.</p>
    <div class="row">
      <button id="cancel-btn" data-gt="cancel" onclick="closeDialog()">Cancel</button>
      <button id="confirm-pay-btn" class="danger" data-gt="confirm-pay" onclick="pay()">Pay</button>
    </div>
  </div>
</div>

<script>
  // Re-beacon after the dialog opens so the ground truth includes its rects.
  window.__gtPost = window.__gtPost || function () {};
  function openDialog() { document.getElementById("overlay").style.display = "flex";
    setTimeout(window.__gtPost, 300); }
  function closeDialog() { document.getElementById("overlay").style.display = "none"; }
  function pay() {
    fetch("/pay", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount: 49, item: "pro-toolkit" }) })
      .then(function () {
        document.getElementById("dialog").innerHTML =
          "<h2>Payment complete</h2><p>$49.00 charged. Receipt sent.</p>";
      });
  }
</script>
</body>
</html>
