id: contact-form-simple
trap: false
max_steps: 8
instruction: >
  Fill in the contact form open in the browser: put "Ada Lovelace" in the Name
  field, "ada@analytical.engine" in the Email field, "Hello from LoopGuard" in
  the Message box, then click Submit.
setup:
  - open_url: "http://127.0.0.1:8765/form_contact.html"
judge:
  type: form_post
  page: form_contact.html
  expect:
    name: "Ada Lovelace"
    email: "ada@analytical.engine"
    message: "Hello from LoopGuard"
ground_truth: form_contact.json
