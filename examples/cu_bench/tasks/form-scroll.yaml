id: form-scroll
trap: false
max_steps: 10
instruction: >
  Send feedback through the feedback form in the browser: name "Grace Hopper",
  feedback "The fold is not a bug", then submit. Note the form is below the
  fold and needs scrolling.
setup:
  - open_url: "http://127.0.0.1:8793/form_scroll.html"
judge:
  type: form_post
  page: form_scroll.html
  expect:
    name: "Grace Hopper"
    feedback: "The fold is not a bug"
ground_truth: form_scroll.json
