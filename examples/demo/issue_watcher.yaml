# LoopGuard demo watcher: triage a file-backed issue queue.
#
# run_demo.sh replaces the @...@ placeholders (the absolute issues.json path
# plus the endpoint/model/key-env from LG_DEMO_*) before installing this
# spec.
#
# Gate backend: an openai-compatible endpoint (CLIProxy by default) whose
# URL, model and key env var are filled in by run_demo.sh, falling back to
# `local` heuristics if the call fails. Backend settings ride on the watcher
# via the `config` block below (merged over the global LoopGuard config by
# the shim and `poll`).
name: demo-issues
source:
  file: "@ISSUES_JSON@"
id_field: id
title_field: title
fingerprint_fields: [title, body]
state_fields: [title, body]
brief: |
  These are demo issues for a project that is not on this machine. Do not
  run commands or search files. For each admitted item write a 3-line triage
  note (summary, likely cause, next step), then a final line DONE <id>.
config:
  backend: auto
  openai:
    base_url: "@BASE_URL@"
    model: "@MODEL@"
    api_key_env: "@KEY_ENV@"
    timeout: 60
gate:
  route_question: kind
  questions:
    kind:
      type: choice
      instructions: What does this issue need?
      criteria:
        bug: a defect in existing behaviour that a code change can fix
        feature: a request for new behaviour
        question: a usage or support question answerable without code changes
        duplicate_or_spam: spam, empty, duplicate, or off-topic
    actionable:
      type: noul
      instructions: Is there enough detail (steps, error text, versions, or a
        precise ask) for an engineer to start now?
      criteria:
        "true": there are steps, error text, versions, or a precise ask
        "false": the report is too vague to act on
  routes:
    bug:
      handler: agent
      min_prob: 0.6
      when: {actionable: ">=0.6"}
      brief: "Work from the issue text only. Do not run commands, search
        files, or push. Include the likely root cause and the smallest fix
        in your triage note."
    duplicate_or_spam:
      handler: drop
      min_prob: 0.75
  default_route: review
