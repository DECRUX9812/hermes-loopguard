name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,typesafe,cu]'
      # tests/test_e2e_hermes.py is deliberately OUT of CI: it requires a real
      # stock Hermes install and installs an upstream package. It is skipped
      # via --ignore, not via its own skip logic.
      - name: Unit tests
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: src
        run: python3 -m pytest -q --ignore tests/test_e2e_hermes.py
